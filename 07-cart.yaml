- name: configure the cart service
  hosts: cart
  become: yes
  tasks:
  - name: disable default nodejs
    command: dnf module disable nodejs -y

  - name: enable nodejs:24
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: create roboshop system cart
    cart:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop system cart"

  - name: remove the existing directory
    file:
      path: /app
      state: absent
  
  - name: remove cart.zip
    file:
      path: /tmp/cart.zip
      state: directory
  
  - name: create app directory
    file:
      path: /app
      state:  directory

  - name: download cart application
    get_url: 
      url: https://raw.githubcartcontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-{{ app_version }}}.zip
      dest: /tmp/cart.zip
    
  - name: unzip cart
    unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes  

  - name: Install npm dependencies
    community.general.npm:
     path: /app 
  
  - name: copy cart service
    template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service

  - name: daemon reload
    systemd_service:
      daemon_reload: true

  - name: start and enable cart
    service:
      name: cart
      state: restarted
      enabled: yes